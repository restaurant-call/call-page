<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Byron｜電話</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
    main{width:min(520px,100%);text-align:center;background:#1c1c1e;border-radius:28px;padding:36px 24px}
    h1{margin:0 0 10px;font-size:32px}
    p{margin:0 0 28px;color:#b7b7bd;line-height:1.6}
    .call{display:block;width:100%;padding:20px;border-radius:18px;background:#2ecc71;color:#07140b;font-size:22px;font-weight:800;text-decoration:none}
    .phone{margin-top:16px;color:#d1d1d6;font-size:17px;letter-spacing:.04em}
    .note{margin-top:22px;font-size:13px;color:#8e8e93}
  </style>
</head>
<body>
  <main>
    <h1>Byron</h1>
    <p>電話でのお問い合わせ</p>
    <a class="call" href="tel:0353567188">電話する</a>
    <div class="phone">03-5356-7188</div>
    <div class="note">タップすると電話アプリが開きます。</div>
  </main>
</body>
</html>
