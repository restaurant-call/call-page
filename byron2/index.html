<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>もつ焼きByron｜電話</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background-image:url("byron2-bg.jpg");
      background-size:contain;
      background-position:center;
      background-repeat:no-repeat;
      background-color:#111;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
    }
    main{
      width:min(520px,100%);
      text-align:center;
      background:rgba(20,20,20,.92);
      border-radius:28px;
      padding:36px 24px;
    }
    h1{margin:0 0 10px;font-size:32px}
    p{margin:0 0 28px;color:#b7b7bd;line-height:1.6}
    .call{
      display:block;
      width:100%;
      padding:20px;
      border-radius:18px;
      background:#2ecc71;
      color:#07140b;
      font-size:22px;
      font-weight:800;
      text-decoration:none;
    }
    .phone{margin-top:16px;color:#d1d1d6;font-size:17px;letter-spacing:.04em}
  </style>
</head>
<body>
  <main>
    <h1>もつ焼きByron</h1>
    <p>ご予約・お問い合わせは<br>こちらからお願いします</p>
    <a class="call" href="tel:0353567188">電話をかける</a>
    <div class="phone">03-5356-7188</div>
  </main>
</body>
</html>
